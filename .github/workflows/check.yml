name: Check

# The patterns are viewed in wmds-gallery (Vercel); this repo no longer publishes a gallery to Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck and render every pattern against the pinned WMDS.
      - run: npm run check
